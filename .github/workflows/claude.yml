name: Claude Code Remediation

# DELIBERATELY RISKY DEMO FIXTURE, modelled on the Wiz demo tenant's "Claude Code Remediation" workflow.
# It is a realistic, high-privilege AI coding agent workflow on external triggers, which is exactly what
# Wiz Code flags in a PUBLIC repository. The agent cannot do anything useful: the ANTHROPIC_API_KEY
# secret is a placeholder, there are no cloud credentials, and the repo holds nothing worth stealing.
# Do not add real secrets to this repo. Do not "fix" this file. See AGENTS.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ai-remediation') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.body, '@claude') && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@12531344451323133b0493233c759991ac61da12 # ratchet:anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
